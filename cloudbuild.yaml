steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/heo-ai-in-action:$COMMIT_SHA',
      '.'
    ]

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'gcr.io/$PROJECT_ID/heo-ai-in-action:$COMMIT_SHA'
    ]

  # Deploy container image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run',
      'deploy',
      'heo-ai-in-action',
      '--image', 'gcr.io/$PROJECT_ID/heo-ai-in-action:$COMMIT_SHA',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--port', '3000',
      '--memory', '2Gi',
      '--cpu', '2',
      '--timeout', '300',
      '--max-instances', '10',
      '--set-env-vars',
      'NODE_ENV=production,GEMINI_API_KEY=${_GEMINI_API_KEY},SKIP_DKG=true'
    ]

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/heo-ai-in-action:$COMMIT_SHA'

# Required for Cloud Run deployment
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _GEMINI_API_KEY: 'placeholder' # Set in Cloud Build triggers 