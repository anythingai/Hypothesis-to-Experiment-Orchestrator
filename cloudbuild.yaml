steps:
  # Install dependencies
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']
    
  # Build the application
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']
    
  # Deploy to App Engine
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: ['app', 'deploy', '--quiet']
    
timeout: '1200s'

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/heo-ai-in-action:$COMMIT_SHA'

# Required for Cloud Run deployment
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _GEMINI_API_KEY: 'placeholder' # Set in Cloud Build triggers 